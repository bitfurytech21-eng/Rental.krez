<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Property data and blockchain workflow</title><desc id="d">Off-chain property data is reviewed and passed through an oracle to blockchain-based smart contracts, while investors interact with tokenized real-world assets.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F9FAF8"/><stop offset="1" stop-color="#EAF1ED"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17372B" flood-opacity=".1"/></filter></defs><rect width="1400" height="760" rx="24" fill="url(#bg)"/><text x="70" y="75" fill="#9A7A45" font-family="Arial,sans-serif" font-size="17" letter-spacing="5">DIGITAL INFRASTRUCTURE</text><text x="70" y="128" fill="#17372B" font-family="Georgia,serif" font-size="42">How property information moves</text><g filter="url(#sh)"><rect x="65" y="190" width="350" height="475" rx="20" fill="#fff" stroke="#D8E4DD"/><rect x="525" y="190" width="350" height="475" rx="20" fill="#fff" stroke="#D8E4DD"/><rect x="985" y="190" width="350" height="475" rx="20" fill="#fff" stroke="#D8E4DD"/></g><g font-family="Arial,sans-serif" fill="#1B382C"><text x="95" y="240" font-size="24" font-weight="700">Off-chain records</text><text x="555" y="240" font-size="24" font-weight="700">Oracle &amp; contracts</text><text x="1015" y="240" font-size="24" font-weight="700">Investors &amp; assets</text></g><g fill="#E6F2EA" stroke="#A9D7B8"><rect x="95" y="275" width="290" height="76" rx="12"/><rect x="95" y="370" width="290" height="76" rx="12"/><rect x="95" y="465" width="290" height="76" rx="12"/><rect x="95" y="560" width="290" height="76" rx="12"/></g><g fill="#255A3D" font-family="Arial,sans-serif"><text x="125" y="307" font-size="18" font-weight="700">Property records</text><text x="125" y="331" font-size="15">NOI, rent rolls, valuations</text><text x="125" y="402" font-size="18" font-weight="700">Market information</text><text x="125" y="426" font-size="15">FX rates and interest rates</text><text x="125" y="497" font-size="18" font-weight="700">Compliance records</text><text x="125" y="521" font-size="15">KYC / AML checks, where required</text><text x="125" y="592" font-size="18" font-weight="700">Asset events</text><text x="125" y="616" font-size="15">Sales, loan and settlement updates</text></g><g fill="#EAF1F8" stroke="#AFC4D8"><rect x="565" y="280" width="270" height="90" rx="14"/><rect x="565" y="405" width="270" height="195" rx="18" fill="#153A35" stroke="#547D70"/></g><g fill="#234B3A" font-family="Arial,sans-serif" text-anchor="middle"><text x="700" y="315" font-size="22" font-weight="700">Oracle layer</text><text x="700" y="344" font-size="15">Validated external inputs</text></g><g fill="#E5D4A5"><path d="M700 438l42 28-42 28-42-28z"/><path d="M700 485l42 28-42 28-42-28z" opacity=".8"/></g><g fill="#fff" font-family="Arial,sans-serif" text-anchor="middle"><text x="700" y="565" font-size="21" font-weight="700">Smart contracts</text><text x="700" y="586" font-size="13" opacity=".8">Rules and transaction records</text></g><g fill="#F2EBDD" stroke="#D9C69B"><rect x="1025" y="280" width="270" height="90" rx="14"/><rect x="1025" y="405" width="270" height="90" rx="14"/><rect x="1025" y="530" width="270" height="90" rx="14"/></g><g fill="#4C442F" font-family="Arial,sans-serif"><text x="1050" y="315" font-size="19" font-weight="700">Token holders</text><text x="1050" y="343" font-size="15">Eligible retail / institutional</text><text x="1050" y="440" font-size="19" font-weight="700">Tokenized interests</text><text x="1050" y="468" font-size="15">Rights defined by legal terms</text><text x="1050" y="565" font-size="19" font-weight="700">Property SPVs</text><text x="1050" y="593" font-size="15">Underlying asset entities</text></g><g fill="none" stroke="#9A7A45" stroke-width="4" stroke-linecap="round"><path d="M415 400h110m-14-12 14 12-14 12M875 400h110m-14-12 14 12-14 12"/><path d="M985 575H875m14-12-14 12 14 12"/></g><g fill="#9A7A45" font-family="Arial,sans-serif" font-size="14"><text x="440" y="382">validated inputs</text><text x="900" y="382">recorded events</text></g></svg>