<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Property ownership structure</title><desc id="d">A property asset is held by a dedicated SPV and connected to an issuer and individual investors.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FCFBF7"/><stop offset="1" stop-color="#EEF4EF"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#18372A" flood-opacity=".09"/></filter></defs><rect width="1200" height="900" rx="28" fill="url(#bg)"/><text x="80" y="88" fill="#9A7A45" font-family="Arial,sans-serif" font-size="18" letter-spacing="5">OWNERSHIP FRAMEWORK</text><text x="80" y="145" fill="#18372A" font-family="Georgia,serif" font-size="46">From asset to participation</text><g filter="url(#s)"><rect x="360" y="195" width="480" height="125" rx="18" fill="#fff" stroke="#D8E5DC"/><rect x="360" y="375" width="480" height="125" rx="18" fill="#fff" stroke="#D8E5DC"/><rect x="360" y="555" width="480" height="125" rx="18" fill="#fff" stroke="#D8E5DC"/></g><g fill="#DDF2E5" stroke="#9BD5B0"><rect x="390" y="222" width="70" height="70" rx="12"/><rect x="390" y="402" width="70" height="70" rx="12"/><rect x="390" y="582" width="70" height="70" rx="12"/></g><g fill="none" stroke="#159B58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M411 274v-30h28v30M417 252h5m8 0h5m-18 10h5m8 0h5M410 274h30"/><rect x="409" y="422" width="32" height="28" rx="5"/><path d="M415 422v-7h20v7m-16 12h12"/><path d="M410 604h30v31h-30zM405 604l20-13 20 13M420 613v15m10-15v15"/></g><g fill="#19372B" font-family="Arial,sans-serif"><text x="490" y="247" font-size="27" font-weight="700">Underlying property</text><text x="490" y="282" font-size="19" fill="#69776E">The real estate asset</text><text x="490" y="427" font-size="27" font-weight="700">Local SPV company</text><text x="490" y="462" font-size="19" fill="#6