roke-width="3"><path d="M285 430h275M285 485h275M285 540h275M285 595h275"/></g><g fill="#2F8A59"><path d="m295 450 8 8 16-19 7 6-23 27-15-15z"/><path d="m295 505 8 8 16-19 7 6-23 27-15-15z"/><path d="m295 560 8 8 16-19 7 6-23 27-15-15z"/></g><g fill="#5E6C63" font-family="Arial,sans-serif" font-size="16"><text x="340" y="455">Title and ownership</text><text x="340" y="510">Valuation and reports</text><text x="340" y="565">Lease and income review</text><text x="340" y="620">Costs and legal terms</text></g></g><text x="90" y="170" fill="#D4B879" font-family="Arial,sans-serif" font-size="18" letter-spacing="5">KRETZ SPAIN · PROPERTY REVIEW</text><text x="90" y="250" fill="#FFFDF6" font-family="Georgia,serif" font-size="58">Clarity before</text><text x="90" y="320" fill="#FFFDF6" font-family="Georgia,serif" font-size="58">commitment.</text><text x="90" y="385" fill="#D7E1D9" font-family="Arial,sans-serif" font-size="22">Review the property, its documents and the terms</text><text x="90" y="420" fill="#D7E1D9" font-family="Arial,sans-serif" font-size="22">that govern each opportunity.</text><path d="M90 475h190" stroke="#D4B879" stroke-width="3"/></svg>