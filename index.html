    <script>
      // Suppress cross-origin "Script error." and Vite HMR WebSocket preview connection errors
      window.addEventListener('unhandledrejection', function(event) {
        if (!event.reason || 
          event.reason.message === 'Script error.' ||
          event.reason?.message?.includes('Script error') ||
          event.reason?.message?.includes('WebSocket') ||
          event.reason?.message?.includes('ws') ||
          event.reason?.stack?.includes('@vite/client')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          event.message === 'Script error.' ||
          event.message?.includes('Script error') ||
          event.message?.includes('WebSocket') ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.preventDefault();
          return true;
        }
      }, true);
    </script>
