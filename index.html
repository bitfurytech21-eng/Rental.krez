    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Intercept Vite HMR WebSocket connections cleanly
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var SafeWebSocket = function(url, protocols) {
            var isViteHmr = (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('vite') !== -1)) ||
                            (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) ||
                            (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; }));

            if (isViteHmr) {
              var fakeSocket = {
                readyState: 1, // OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: url,
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                addEventListener: function(type, listener) {
                  if (type === 'open' && typeof listener === 'function') {
                    setTimeout(listener, 10);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {}
              };
              setTimeout(function() {
                if (typeof fakeSocket.onopen === 'function') fakeSocket.onopen({});
              }, 10);
              return fakeSocket;
            }

            try {
              return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            } catch (e) {
              return new NativeWebSocket(url);
            }
          };

          SafeWebSocket.prototype = NativeWebSocket.prototype;
          SafeWebSocket.CONNECTING = 0;
          SafeWebSocket.OPEN = 1;
          SafeWebSocket.CLOSING = 2;
          SafeWebSocket.CLOSED = 3;
          window.WebSocket = SafeWebSocket;
        }

        // 2. Suppress Vite HMR noise in iframe environment
        function shouldSuppress(err, msg, file, stack) {
          var str = (msg || '') + ' ' + (file || '') + ' ' + (stack || '') + ' ' + (err && err.stack ? err.stack : '') + ' ' + (err && err.message ? err.message : '');
          return str.indexOf('@vite/client') !== -1 ||
                 str.indexOf('vite/client') !== -1 ||
                 str.indexOf('ws://') !== -1 ||
                 str.indexOf('wss://') !== -1;
        }

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.error, event.message, event.filename, event.error && event.error.stack)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (shouldSuppress(reason, reason && reason.message, '', reason && reason.stack)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
