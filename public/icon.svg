<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D0B"/>
      <stop offset="50%" stop-color="#0E201C"/>
      <stop offset="100%" stop-color="#06100E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Geometric Luxury Monogram & Architecture Shield -->
  <g transform="translate(256, 240)">
    <!-- Central Shield Diamond -->
    <polygon points="0,-130 115,-30 115,85 0,145 -115,85 -115,-30" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#glow)"/>
    <polygon points="0,-115 100,-25 100,75 0,130 -100,75 -100,-25" fill="#0E201C" fill-opacity="0.6" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Architectural Pillars / Real Estate Geometry -->
    <line x1="-55" y1="-10" x2="-55" y2="65" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-45" x2="0" y2="105" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="55" y1="-10" x2="55" y2="65" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Luxury Keystone / Roof Pediment -->
    <path d="M -75,-25 L 0,-85 L 75,-25" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Tokenization Token Node Star -->
    <circle cx="0" cy="-85" r="7" fill="#FCD34D"/>
    <circle cx="-75" cy="-25" r="5" fill="#10B981"/>
    <circle cx="75" cy="-25" r="5" fill="#10B981"/>
    <circle cx="0" cy="105" r="5" fill="#FCD34D"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Playfair Display', serif, system-ui" font-size="34" font-weight="700" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle">L'AGENCE</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#9CA3AF" text-anchor="middle">PARIS · BARCELONA</text>
</svg>
