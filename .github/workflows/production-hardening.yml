name: Production hardening checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps
      - name: TypeScript check
        run: npm run lint
      - name: Automated tests
        run: npm test
      - name: Production build
        env:
          VITE_API_BASE_URL: https://api.kretzdespain.com/api/v1
        run: npm run build
      - name: Cloudflare API Worker dry run
        run: npx --yes wrangler@4.162.0 deploy --dry-run --config wrangler.api.toml
