# Separate Cloudflare Worker configuration for the API.
# The root wrangler.toml remains the Cloudflare Pages frontend configuration.
name = "rental-krez-api"
main = "worker.ts"
compatibility_date = "2026-11-13"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules",
  "enable_nodejs_http_server_modules",
  "nodejs_compat_populate_process_env"
]
workers_dev = true

[vars]
AUTH_SESSION_STORE = "supabase"
ALLOWED_ORIGINS = "https://rental-krez.pages.dev,https://kretzdespain.com,https://www.kretzdespain.com"
API_VERSION = "v1"
EMAIL_FROM = "info@kretzdespain.com"
EMAIL_REPLY_TO = "info@kretzdespain.com"
EMAIL_SENDER_NAME = "Kretz Real Estate"
EMAIL_SUPPORT = "info@kretzdespain.com"
EMAIL_TEST_MODE = "false"
ENVIRONMENT = "production"
NODE_ENV = "production"
PUBLIC_APP_URL = "https://kretzdespain.com"

# Keep the Supabase project URL explicit for Worker-side process.env readers.
# The VITE_ variant is retained for compatibility with existing deployments.
SUPABASE_URL = "https://mpwsbepgnxvritrnchdg.supabase.co"
VITE_SUPABASE_URL = "https://mpwsbepgnxvritrnchdg.supabase.co/"

# Configure these as encrypted Cloudflare Worker secrets; never put key values here:
# SUPABASE_ANON_KEY (or the supported publishable-key binding)
# SUPABASE_SERVICE_ROLE_KEY
# SESSION_SECRET
# nodejs_compat_populate_process_env exposes Worker bindings to existing process.env readers.

# Express imports body-parser internally during module initialization. The Worker
# uses its own bounded parser, so alias the unused package to avoid pulling in
# raw-body/iconv-lite, which is incompatible with this Worker bundle.
[alias]
"body-parser" = "./cloudflare/body-parser-shim.js"
"iconv-lite" = "./cloudflare/iconv-lite-shim.js"

# Worker Previews are created from this separate API configuration.
# Keep this empty until preview-safe bindings/secrets are configured in Cloudflare.
previews = {}

# Cloudflare Worker observability settings.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
