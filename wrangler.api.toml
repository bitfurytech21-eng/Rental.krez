# Separate Cloudflare Worker configuration for the API.
# The root wrangler.toml remains the Cloudflare Pages frontend configuration.
name = "rental-krez-api"
main = "worker.ts"
compatibility_date = "2026-11-13"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules",
  "enable_nodejs_http_server_modules"
]
workers_dev = true

# ...
[vars]
ALLOWED_ORIGINS = "https://rental-krez.pages.dev,https://kretzdespain.com,https://www.kretzdespain.com"
API_VERSION = "v1"
EMAIL_FROM = "info@kretzdespain.com"
EMAIL_REPLY_TO = "info@kretzdespain.com"
EMAIL_SENDER_NAME = "Kretz Real Estate"
EMAIL_SUPPORT = "info@kretzdespain.com"
EMAIL_TEST_MODE = "false"
ENVIRONMENT = "production"
TURNSTILE_ALLOWED_HOSTNAMES = "kretzdespain.com,www.kretzdespain.com,rental-krez.pages.dev"
NODE_ENV = "production"
PUBLIC_APP_URL = "https://rental-krez.pages.dev"
# SESSION_SECRET must be configured as an encrypted Worker secret, never in this file.
# ...

# Express imports body-parser internally during module initialization. The Worker
# uses its own bounded parser, so alias the unused package to avoid pulling in
# raw-body/iconv-lite, which is incompatible with this Worker bundle.
[alias]
"body-parser" = "./cloudflare/body-parser-shim.js"
"iconv-lite" = "./cloudflare/iconv-lite-shim.js"
